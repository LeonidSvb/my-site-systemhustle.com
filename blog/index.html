<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blog — System Hustle</title>
<meta name="description" content="Engineering notes from building outbound infrastructure — real numbers, named tools, nothing held back.">
<meta property="og:title" content="System Hustle — Blog">
<meta property="og:description" content="Engineering notes from building outbound infrastructure — real numbers, named tools, nothing held back.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://systemhustle.com/blog/">
<meta name="twitter:card" content="summary">
<style>
  :root{
    color-scheme: light;
    --bg: #f1eee6;
    --surface: #faf8f2;
    --surface-2: #ffffff;
    --ink: #1c1811;
    --ink-2: #57503f;
    --ink-3: #8c8474;
    --border: rgba(28,24,17,0.12);
    --border-strong: rgba(28,24,17,0.22);
    --accent: #0f9e8f;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #16130f;
      --surface: #1d1912;
      --surface-2: #211c15;
      --ink: #f3efe6;
      --ink-2: #c7bfac;
      --ink-3: #8c8474;
      --border: rgba(243,239,230,0.12);
      --border-strong: rgba(243,239,230,0.22);
      --accent: #17b39f;
      --accent-ink: #08211d;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #16130f;
    --surface: #1d1912;
    --surface-2: #211c15;
    --ink: #f3efe6;
    --ink-2: #c7bfac;
    --ink-3: #8c8474;
    --border: rgba(243,239,230,0.12);
    --border-strong: rgba(243,239,230,0.22);
    --accent: #17b39f;
    --accent-ink: #08211d;
  }

  * { box-sizing: border-box; }
  html, body{ margin: 0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{ max-width: 860px; margin: 0 auto; padding-inline: 20px; }

  header.top{
    position: sticky; top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
  }
  .top-inner{
    max-width: 860px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: "IBM Plex Mono", monospace; font-size: 12.5px;
    color: var(--ink-2); letter-spacing: 0.02em;
  }
  .top-inner a.mark{ color: var(--ink); font-weight: 600; text-decoration: none; }
  .top-inner a.mark span{ color: var(--accent); }
  .top-inner a{ color: var(--ink-3); text-decoration: none; }

  main{ padding-block: 56px 90px; }

  .eyebrow{
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin: 0 0 16px;
  }
  h1.headline{
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600; font-size: clamp(30px, 5vw, 42px); line-height: 1.1;
    letter-spacing: -0.01em; text-wrap: balance; margin: 0 0 14px;
  }
  .dek{ font-size: 17.5px; color: var(--ink-2); max-width: 56ch; margin: 0 0 36px; }

  .tag-filter{ display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 36px; }
  .tag-pill{
    font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600;
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border-strong);
    background: var(--surface-2); color: var(--ink-2); cursor: pointer;
  }
  .tag-pill.active{ background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .post-list{ display: flex; flex-direction: column; gap: 2px; }
  .post-card{
    display: block; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px 24px; margin-bottom: 14px;
  }
  .post-card .post-meta{
    font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-3);
    display: flex; gap: 12px; align-items: center; margin-bottom: 10px;
  }
  .post-card .post-meta .tag{ color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .post-card h2{
    font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 22px;
    margin: 0 0 8px; line-height: 1.2; color: var(--ink);
  }
  .post-card p{ font-size: 15px; color: var(--ink-2); margin: 0; }
  .empty-note{ font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--ink-3); padding: 20px 0; }

  footer.bottom{
    max-width: 860px; margin: 50px auto 0; padding: 20px 20px 40px;
    border-top: 1px solid var(--border);
    font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-3);
  }
  footer.bottom a{ color: var(--ink-2); }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,900;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <a class="mark" href="/blog/">systemhustle<span>.</span>blog</a>
    <a href="https://systemhustle.com">systemhustle.com ↗</a>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="eyebrow">Engineering notes</p>
    <h1 class="headline">The Blog</h1>
    <p class="dek">Real numbers from building outbound infrastructure. No lorem ipsum in the charts, no made-up cost figures — if it's not measured, it's flagged as not measured.</p>

    <div id="tag-filter" class="tag-filter"></div>
    <div id="post-list" class="post-list"></div>
  </div>
</main>

<footer class="bottom">
  <div><a href="https://systemhustle.com">systemhustle.com</a></div>
</footer>

<script src="/blog/posts-data.js"></script>
<script>
(function(){
  var posts = (window.BLOG_POSTS || []).slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
  var listEl = document.getElementById("post-list");
  var filterEl = document.getElementById("tag-filter");
  var activeTag = null;

  function fmtDate(iso){
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-US", { day: "numeric", month: "short" });
  }

  function render(){
    listEl.innerHTML = "";
    var visible = activeTag ? posts.filter(function(p){ return p.tags.indexOf(activeTag) !== -1; }) : posts;
    if(!visible.length){
      listEl.innerHTML = '<div class="empty-note">Nothing tagged "' + activeTag + '" yet.</div>';
      return;
    }
    visible.forEach(function(p){
      var a = document.createElement("a");
      a.className = "post-card";
      a.href = "/blog/" + p.slug + "/";
      a.innerHTML =
        '<div class="post-meta"><span>' + fmtDate(p.date) + '</span><span class="tag">' + p.tags[0] + '</span></div>' +
        '<h2>' + p.title + '</h2>' +
        '<p>' + p.excerpt + '</p>';
      listEl.appendChild(a);
    });
  }

  function renderFilter(){
    var tags = [];
    posts.forEach(function(p){ p.tags.forEach(function(t){ if(tags.indexOf(t) === -1) tags.push(t); }); });
    filterEl.innerHTML = "";
    var all = document.createElement("button");
    all.className = "tag-pill" + (activeTag === null ? " active" : "");
    all.textContent = "All";
    all.onclick = function(){ activeTag = null; renderFilter(); render(); };
    filterEl.appendChild(all);
    tags.forEach(function(t){
      var b = document.createElement("button");
      b.className = "tag-pill" + (activeTag === t ? " active" : "");
      b.textContent = t;
      b.onclick = function(){ activeTag = t; renderFilter(); render(); };
      filterEl.appendChild(b);
    });
  }

  try{ renderFilter(); render(); }catch(e){ listEl.innerHTML = '<div class="empty-note">Couldn\'t load posts.</div>'; }
})();
</script>
</body>
</html>
