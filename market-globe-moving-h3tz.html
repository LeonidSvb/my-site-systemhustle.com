<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f2f1ea;
    --surface: #fbfaf5;
    --ink: #1c1c1a;
    --muted: #6b6b63;
    --faint: #9a998f;
    --accent: #a8762f;
    --accent-soft: #d0a45c;
    --dark: #23261f;
    --line: #dcdace;
    --radius-fill: rgba(35, 38, 31, 0.035);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: 'Source Sans 3', -apple-system, 'Segoe UI', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 44px 32px 56px; }

  .eyebrow { display: flex; justify-content: space-between; gap: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .eyebrow b { color: var(--accent); font-weight: 600; }
  h1 { font-size: clamp(30px, 4.4vw, 46px); line-height: 1.05; letter-spacing: -0.02em; font-weight: 800; margin: 18px 0 12px; max-width: 16ch; }
  .sub { font-size: 18px; line-height: 1.5; color: var(--muted); max-width: 62ch; margin: 0; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); background: var(--surface); margin: 32px 0 28px; }
  .kpi { padding: 18px 20px 20px; border-right: 1px solid var(--line); }
  .kpi:last-child { border-right: none; }
  .kpi .num { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .kpi .num.dark { color: var(--dark); }
  .kpi .lbl { font-size: 13.5px; line-height: 1.4; color: var(--muted); margin-top: 6px; }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: stretch; }
  .mapcard { position: relative; border: 1px solid var(--line); background: var(--surface); min-height: 640px; }
  #map { position: absolute; inset: 0; background: #ebe9df; }
  .leaflet-container { font-family: 'Source Sans 3', sans-serif; }
  .leaflet-tile-pane { filter: grayscale(1) sepia(0.22) contrast(0.86) brightness(1.07); }
  .toggle { position: absolute; z-index: 500; top: 14px; left: 14px; display: flex; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(28,28,26,0.08); }
  .toggle button { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 0; background: transparent; color: var(--muted); padding: 9px 13px; cursor: pointer; }
  .toggle button + button { border-left: 1px solid var(--line); }
  .toggle button.on { background: var(--dark); color: #f2f1ea; }
  .toggle.zoomto { top: auto; bottom: 40px; left: 14px; }
  .mapnote { position: absolute; z-index: 500; bottom: 12px; left: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.04em; color: var(--muted); background: rgba(251,250,245,0.92); border: 1px solid var(--line); padding: 5px 9px; }

  .side { display: flex; flex-direction: column; gap: 20px; }
  .panel { border: 1px solid var(--line); background: var(--surface); padding: 18px 18px 14px; }
  .panel h3 { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
  .panel h3 span { color: var(--faint); letter-spacing: 0.04em; text-transform: none; font-weight: 400; }
  .cat { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; padding: 7px 4px; cursor: pointer; border-radius: 2px; user-select: none; }
  .cat:hover { background: rgba(168,118,47,0.07); }
  .cat .sw { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px currentColor; }
  .cat .nm { font-size: 14.5px; line-height: 1.25; }
  .cat .ct { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14.5px; }
  .cat .bar { grid-column: 2 / 4; height: 3px; background: var(--line); margin-top: -2px; }
  .cat .bar i { display: block; height: 100%; }
  .cat.off .nm, .cat.off .ct { color: var(--faint); }
  .cat.off .sw { opacity: 0.25; }
  .cat.off .bar i { opacity: 0.25; }
  .hint { font-size: 12.5px; color: var(--faint); margin: 8px 4px 0; }

  .spot { display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--line); cursor: pointer; }
  .spot:first-of-type { border-top: none; padding-top: 2px; }
  .spot:hover .sh { color: var(--accent); }
  .spot .n { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .spot .ar { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  .spot .sh { font-weight: 700; font-size: 14.5px; line-height: 1.3; margin: 3px 0 5px; transition: color .15s; }
  .spot .ev { font-size: 13.5px; line-height: 1.45; color: var(--muted); }
  .spot .co { font-weight: 800; font-size: 15.5px; line-height: 1.25; margin: 3px 0 2px; }
  .spot .co + .sh { font-weight: 500; color: var(--muted); font-size: 13.5px; margin-top: 0; }
  .spot .ct2 { font-size: 13px; line-height: 1.5; margin-top: 8px; color: var(--muted); }
  .spot .ct2 a, .pp-l a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); font-weight: 600; }
  .spot .ct2 a.tel, .pp-l a.tel { color: var(--ink); border-bottom-color: var(--faint); }
  .pp-l { margin-top: 8px; font-size: 13px; color: var(--muted); }

  .lower { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; align-items: start; }
  .comp p { font-size: 15px; line-height: 1.5; margin: 0 0 12px; }
  .comp ul { list-style: none; margin: 0; padding: 0; }
  .comp li { padding: 9px 0; border-top: 1px solid var(--line); font-size: 14.5px; line-height: 1.4; }
  .comp li b { font-weight: 700; }
  .comp li span { color: var(--muted); }
  .next { background: var(--dark); color: #e8e7de; padding: 22px 24px; }
  .next h3 { color: var(--accent-soft); }
  .next p { font-size: 15.5px; line-height: 1.55; margin: 0 0 14px; }
  .next .terms { display: flex; flex-wrap: wrap; gap: 8px; }
  .next .terms span { font-family: 'IBM Plex Mono', monospace; font-size: 12px; border: 1px solid rgba(208,164,92,0.5); color: #f2f1ea; padding: 6px 10px; }

  footer { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  footer b { color: var(--ink); }

  .leaflet-popup-content-wrapper { border-radius: 2px; box-shadow: 0 6px 24px rgba(28,28,26,0.16); background: var(--surface); }
  .leaflet-popup-tip { background: var(--surface); }
  .leaflet-popup-content { margin: 12px 14px; font-size: 13.5px; line-height: 1.45; color: var(--ink); }
  .pp-k { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  .pp-t { font-weight: 700; font-size: 14.5px; margin: 2px 0 4px; }
  .pp-n { color: var(--muted); font-size: 12.5px; }
  .pp-e { color: var(--ink); margin-top: 4px; }

  .spin { position: relative; width: 30px; height: 30px; }
  .spin .core { position: absolute; inset: 0; border-radius: 50%; background: var(--accent); color: #fff; font: 800 14px 'Source Sans 3', sans-serif; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  .spin .ring { position: absolute; inset: -9px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(0.55); opacity: 0.8; } 100% { transform: scale(1.45); opacity: 0; } }
  .shop { width: 16px; height: 16px; background: var(--dark); border: 2px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,0.3); transform: rotate(45deg); }
  .shoplbl { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--dark); color: #f2f1ea; border: none; border-radius: 0; box-shadow: none; padding: 3px 7px; }
  .shoplbl::before { display: none; }

  .lmk { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid var(--dark); box-shadow: 0 1px 5px rgba(0,0,0,0.3); }
  .lmklbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 0; box-shadow: none; padding: 2px 6px; }
  .lmklbl::before { display: none; }
  .arr { width: 14px; height: 14px; background: var(--accent); border: 2px solid #fff; transform: rotate(45deg); box-shadow: 0 0 0 3px rgba(168,118,47,0.25), 0 1px 6px rgba(0,0,0,0.3); }

  .smp { margin-top: 20px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; border: 1px solid var(--line); background: var(--surface); padding: 26px 28px; align-items: start; }
  .smp h3 { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 10px; }
  .smp-l p { font-size: 15px; line-height: 1.55; color: var(--muted); margin: 0; }
  .mail { border: 1px solid var(--line); background: #fff; box-shadow: 0 6px 22px rgba(28,28,26,0.07); }
  .mail-h { border-bottom: 1px solid var(--line); padding: 12px 18px; font-size: 14px; line-height: 1.7; }
  .mail-h span { display: inline-block; width: 64px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  .mail-b { padding: 16px 18px 6px; font-size: 15px; line-height: 1.6; }
  .mail-b p { margin: 0 0 12px; }
  .prop { margin-top: 20px; border: 1px solid var(--line); background: var(--surface); padding: 28px 28px 26px; }
  .prop h2 { font-size: clamp(24px, 3vw, 32px); line-height: 1.1; letter-spacing: -0.015em; font-weight: 800; margin: 14px 0 8px; }
  .prop .sub { font-size: 16.5px; }
  .prop-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 24px; }
  .prop-b h3, .prop-tl-h { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 10px; }
  .prop-b ul { list-style: none; margin: 0; padding: 0; }
  .prop-b li { position: relative; padding: 9px 0 9px 22px; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.5; }
  .prop-b li::before { content: '→'; position: absolute; left: 0; top: 9px; color: var(--accent); font-weight: 700; }
  .prop-terms { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 26px; background: var(--dark); }
  .pt { padding: 16px 18px 18px; border-right: 1px solid rgba(208,164,92,0.25); }
  .pt:last-child { border-right: none; }
  .pt-k { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-soft); }
  .pt-v { color: #f2f1ea; font-size: 15px; line-height: 1.45; margin-top: 6px; }
  .prop-tl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-top: 22px; border-top: 2px solid var(--dark); }
  .tl { padding: 12px 14px 0 0; position: relative; }
  .tl::before { content: ''; position: absolute; top: -7px; left: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
  .tl-d { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-top: 6px; }
  .tl-t { font-size: 14px; line-height: 1.45; color: var(--muted); margin-top: 4px; }

  @media (max-width: 960px) {
    .prop-cols { grid-template-columns: 1fr; gap: 18px; }
    .smp { grid-template-columns: 1fr; gap: 16px; padding: 20px 16px; }
    .prop-terms, .prop-tl { grid-template-columns: 1fr 1fr; }
    .pt:nth-child(2) { border-right: none; }
    .pt:nth-child(-n+2) { border-bottom: 1px solid rgba(208,164,92,0.25); }
    .tl { padding-bottom: 14px; }
    .main { grid-template-columns: 1fr; }
    .lower { grid-template-columns: 1fr; }
    .mapcard { min-height: 520px; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 28px 16px 40px; }
    .eyebrow > span:last-child { display: none; }
    .sub { font-size: 16px; }
    .kpis { grid-template-columns: 1fr 1fr; margin: 24px 0 20px; }
    .kpi { padding: 14px 14px 16px; }
    .kpi:nth-child(2) { border-right: none; }
    .kpi:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    .kpi .num { font-size: 27px; }
    .kpi .lbl { font-size: 12.5px; }
    .mapcard { min-height: 440px; }
    .toggle button { padding: 8px 10px; font-size: 10.5px; }
    .prop { padding: 20px 16px; }
    .lmklbl { display: none; }
    .prop-terms, .prop-tl { grid-template-columns: 1fr; }
    .pt { border-right: none; border-bottom: 1px solid rgba(208,164,92,0.25); }
  }
</style>
</head>

</div>

<script>
(function () {
  const D = JSON.parse(document.getElementById('market-data').textContent);
  const fmt = n => (n == null ? '' : n.toLocaleString('en-US'));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const bucketBy = Object.fromEntries(D.buckets.map(b => [b.key, b]));
  const miles = D.client.radius_mi;

  const CP = D.copy || {};
  const pick = (k, dflt) => (CP[k] !== undefined ? CP[k] : dflt);
  document.title = 'Market Map — ' + D.client.company;
  document.getElementById('e-client').textContent = 'Prepared for ' + D.client.person;
  document.getElementById('h-title').textContent = pick('title', 'Your ' + miles + '-mile radius, mapped.');
  document.getElementById('h-sub').textContent = pick('sub', 'Every business around ' + D.client.center.label + ' that runs trucks or heavy equipment — and the first 100 I’d go after for ' + D.client.company.replace(/ of .*/, '') + '.');
  if (CP.toggle_targets) document.getElementById('t-targets').textContent = CP.toggle_targets;
  if (CP.panel_cats) document.getElementById('p-cats').textContent = CP.panel_cats;
  if (CP.panel_spots) document.getElementById('p-spots').textContent = CP.panel_spots;

  const k = D.totals;
  document.getElementById('kpis').innerHTML = pick('kpis', [
    [fmt(k.core), 'businesses running trucks or heavy equipment in your radius', ''],
    ['+' + fmt(k.extra), 'more in towing, propane, septic and equipment rental', 'dark'],
    [fmt(k.hiring), 'local fleets posting for a diesel or fleet mechanic right now', ''],
    [fmt(k.targets), 'first-wave targets on the map, picked by fleet signals', 'dark']
  ]).map(([n, l, c]) => '<div class="kpi"><div class="num ' + c + '">' + n + '</div><div class="lbl">' + l + '</div></div>').join('');

  const map = L.map('map', { zoomControl: false, scrollWheelZoom: false, attributionControl: true, zoomSnap: 0.1, zoomDelta: 0.5 });
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  map.on('click', () => map.scrollWheelZoom.enable());

  const c = D.client.center;
  // One circle around the client's center, or several (client.circles) when they serve separate metros.
  const circles = D.client.circles || [{ lat: c.lat, lng: c.lng, radius_mi: miles }];
  let radiusBounds = null;
  circles.forEach(ci => {
    const b = L.latLng(ci.lat, ci.lng).toBounds(ci.radius_mi * 1609.34 * 2);
    radiusBounds = radiusBounds ? radiusBounds.extend(b) : b;
    L.circle([ci.lat, ci.lng], { radius: ci.radius_mi * 1609.34, color: '#23261f', weight: 1.5, dashArray: '6 7', fillColor: '#23261f', fillOpacity: 0.035, interactive: false }).addTo(map);
    if (ci.label) L.marker([ci.lat + ci.radius_mi / 69 * 0.93, ci.lng], { icon: L.divIcon({ className: '', html: '', iconSize: [0, 0] }), interactive: false })
      .bindTooltip(ci.label, { permanent: true, direction: 'top', className: 'lmklbl' }).addTo(map);
  });
  // Several circles far apart (Winnipeg + Brandon) leave the map mostly empty, so add one button per circle and
  // let the data pick which view opens first (client.default_view: circle index; omitted = all circles).
  const circleBounds = circles.map(ci => L.latLng(ci.lat, ci.lng).toBounds(ci.radius_mi * 1609.34 * 2));
  let view = D.client.default_view != null ? circleBounds[D.client.default_view] : radiusBounds;
  const fitView = () => map.fitBounds(view, { padding: [6, 6] });
  fitView();
  new ResizeObserver(() => { map.invalidateSize(); fitView(); }).observe(document.querySelector('.mapcard'));
  if (circles.length > 1 && circles.every(ci => ci.label)) {
    const zb = document.createElement('div'); zb.className = 'toggle zoomto';
    zb.innerHTML = '<button data-v="all">All</button>' + circles.map((ci, i) => '<button data-v="' + i + '">' + esc(ci.label) + '</button>').join('');
    document.querySelector('.mapcard').appendChild(zb);
    const mark = () => zb.querySelectorAll('button').forEach(b => b.classList.toggle('on', (b.dataset.v === 'all' ? radiusBounds : circleBounds[+b.dataset.v]) === view));
    zb.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { view = b.dataset.v === 'all' ? radiusBounds : circleBounds[+b.dataset.v]; map.flyToBounds(view, { padding: [6, 6], duration: 0.8 }); mark(); }));
    mark();
  }

  const heat = L.heatLayer(D.heat, {
    radius: 16, blur: 20, maxZoom: 12, minOpacity: 0.25,
    gradient: { 0.15: '#efe3c6', 0.4: '#e0bd7c', 0.65: '#c48d3c', 0.85: '#9a5f22', 1: '#5e3410' }
  });

  const targetLayer = L.layerGroup().addTo(map);
  const markers = D.targets.map(t => {
    const b = bucketBy[t.bucket];
    const m = L.circleMarker([t.lat, t.lng], { radius: 6.5, weight: 1.6, color: '#ffffff', fillColor: b.color, fillOpacity: 0.95 });
    m.bindPopup('<div class="pp-k">' + esc(b.label) + '</div><div class="pp-t">' + esc(t.kind) + (t.town ? ' · ' + esc(t.town) : '') + '</div><div class="pp-n">' + esc(pick('withheld', 'Name shared once the pilot starts.')) + '</div>', { closeButton: false, maxWidth: 240 });
    m._bucket = t.bucket;
    return m;
  });
  const active = new Set(D.buckets.map(b => b.key));
  function drawTargets() {
    targetLayer.clearLayers();
    markers.forEach(m => { if (active.has(m._bucket)) targetLayer.addLayer(m); });
  }
  drawTargets();

  (D.client.shops || []).forEach(s => {
    L.marker([s.lat, s.lng], { icon: L.divIcon({ className: '', html: '<div class="shop"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }), zIndexOffset: 900, keyboard: false })
      .bindTooltip(s.tag ? s.tag : (window.innerWidth < 640 ? 'Your shop' : 'Your shop \u00b7 ' + s.label.replace(/ shop$/i, '').replace('North ', 'N. ')), { permanent: true, direction: s.dir || (s.lng > c.lng ? 'right' : 'left'), offset: [(s.dir || (s.lng > c.lng ? 'right' : 'left')) === 'right' ? 10 : -10, 0], className: 'shoplbl' })
      .addTo(map);
  });

  (D.landmarks || []).forEach(s => {
    L.marker([s.lat, s.lng], { icon: L.divIcon({ className: '', html: '<div class="lmk"></div>', iconSize: [12, 12], iconAnchor: [6, 6] }), zIndexOffset: 800, keyboard: false })
      .bindTooltip(s.label, { permanent: true, direction: s.dir || 'right', offset: [s.dir === 'left' ? -8 : 8, 0], className: 'lmklbl' })
      .addTo(map);
  });

  (D.arrivals || []).forEach(a => {
    L.marker([a.lat, a.lng], { icon: L.divIcon({ className: '', html: '<div class="arr"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }), zIndexOffset: 950 })
      .bindPopup('<div class="pp-k">' + esc(a.kicker) + '</div><div class="pp-t">' + esc(a.name) + '</div><div class="pp-e">' + esc(a.evidence) + '</div>' + (a.link ? '<div class="pp-l"><a href="' + esc(a.link) + '" target="_blank" rel="noopener">' + esc(a.link_label || 'Read the announcement →') + '</a></div>' : ''), { maxWidth: 290 })
      .addTo(map);
  });

  function contactHtml(s, cls) {
    const parts = [];
    if (s.phone) parts.push('<a class="tel" href="tel:' + esc(s.phone) + '">' + esc(s.phone_label || s.phone) + '</a>');
    if (s.link) parts.push('<a href="' + esc(s.link) + '" target="_blank" rel="noopener">' + esc(s.link_label || 'View the job posting →') + '</a>');
    const addr = s.address ? esc(s.address) + '<br>' : '';
    return parts.length || addr ? '<div class="' + cls + '">' + addr + parts.join(' &nbsp;·&nbsp; ') + '</div>' : '';
  }

  const spotMarkers = D.spotlights.map((s, i) => {
    const b = bucketBy[s.bucket];
    const icon = L.divIcon({ className: '', html: '<div class="spin"><div class="ring"></div><div class="core">' + (i + 1) + '</div></div>', iconSize: [30, 30], iconAnchor: [15, 15] });
    return L.marker([s.lat, s.lng], { icon, zIndexOffset: 1000 })
      .bindPopup('<div class="pp-k">' + esc(b.label) + ' · ' + esc(s.area) + '</div><div class="pp-t">' + esc(s.name || s.headline) + '</div>' + (s.name ? '<div class="pp-n">' + esc(s.headline) + '</div>' : '') + '<div class="pp-e">' + esc(s.evidence) + '</div>' + contactHtml(s, 'pp-l'), { maxWidth: 290 })
      .addTo(map);
  });

  const maxCount = Math.max(...D.buckets.map(b => b.count));
  const catsEl = document.getElementById('cats');
  catsEl.innerHTML = D.buckets.map(b =>
    '<div class="cat" data-k="' + b.key + '" style="color:' + b.color + '"><span class="sw" style="background:' + b.color + '"></span>' +
    '<span class="nm" style="color:var(--ink)">' + esc(b.label) + '</span><span class="ct" style="color:var(--ink)">' + fmt(b.count) + '</span>' +
    '<span class="bar"><i style="width:' + (b.count / maxCount * 100).toFixed(1) + '%;background:' + b.color + '"></i></span></div>'
  ).join('') + '<p class="hint">' + esc(pick('hint', 'Counts are every business in the category within ' + miles + ' miles. Dots are the first 100 to contact.')) + '</p>';
  catsEl.querySelectorAll('.cat').forEach(el => el.addEventListener('click', () => {
    const key = el.dataset.k;
    if (active.size === D.buckets.length) { active.clear(); active.add(key); }
    else if (active.has(key) && active.size === 1) { D.buckets.forEach(b => active.add(b.key)); }
    else if (active.has(key)) active.delete(key);
    else active.add(key);
    catsEl.querySelectorAll('.cat').forEach(x => x.classList.toggle('off', !active.has(x.dataset.k)));
    drawTargets();
  }));

  const spotsEl = document.getElementById('spots');
  spotsEl.innerHTML = D.spotlights.map((s, i) =>
    '<div class="spot" data-i="' + i + '"><div class="n">' + (i + 1) + '</div><div><div class="ar">' + esc(bucketBy[s.bucket].label) + ' · ' + esc(s.area) + '</div>' +
    (s.name ? '<div class="co">' + esc(s.name) + '</div>' : '') + '<div class="sh">' + esc(s.headline) + '</div><div class="ev">' + esc(s.evidence) + '</div>' + contactHtml(s, 'ct2') + '</div></div>'
  ).join('');
  spotsEl.querySelectorAll('.spot').forEach(el => el.addEventListener('click', (ev) => {
    if (ev.target.closest('a')) return;
    const m = spotMarkers[+el.dataset.i];
    map.flyTo(m.getLatLng(), 11, { duration: 0.8 });
    setTimeout(() => m.openPopup(), 850);
    if (window.innerWidth < 960) document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }));

  const note = document.getElementById('mapnote');
  function setMode(mode) {
    document.querySelectorAll('#toggle button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
    if (mode === 'targets' || mode === 'both') { if (!map.hasLayer(targetLayer)) targetLayer.addTo(map); } else map.removeLayer(targetLayer);
    if (mode === 'density' || mode === 'both') { if (!map.hasLayer(heat)) heat.addTo(map); } else map.removeLayer(heat);
    const MN = pick('mapnote', {});
    note.textContent = mode === 'targets' ? (MN.targets || D.totals.targets + ' first-wave targets · names withheld')
      : mode === 'density' ? (MN.density || 'Density of ' + fmt(D.totals.sampled) + ' mapped listings')
      : (MN.both || 'First 100 over market density');
  }
  document.querySelectorAll('#toggle button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  setMode('targets');

  document.getElementById('comp').innerHTML = '<h3>' + esc(pick('comp_title', 'The market is moving')) + '</h3>' +
    '<p>' + esc(pick('comp_intro', 'Mobile fleet maintenance outfits are staffing up in ' + c.label + ' this month — the demand is there, and they know it.')) + '</p>' +
    '<ul>' + D.competitors.map(x => '<li><b>' + esc(x.name) + '</b> <span>— ' + esc(x.detail) + '</span></li>').join('') + '</ul>';

  document.getElementById('next').innerHTML = '<h3 class="mono" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px;font-weight:600">What happens next</h3>' +
    '<p>' + esc(pick('next_text', 'These 100 are wave one. Each gets looked at and a personal message — the moment one says yes, you get their name and number and call them yourself.')) + '</p>' +
    '<div class="terms">' + pick('next_terms', ['$1,500 pilot', '5 qualified intros', '1–2 months', 'money-back']).map(t => '<span>' + esc(t) + '</span>').join('') + '</div>';

  const SM = D.sample;
  if (SM) {
    document.getElementById('sample').innerHTML = '<section class="smp"><div class="smp-l"><h3>' + esc(SM.title) + '</h3><p>' + esc(SM.note) + '</p></div>' +
      '<div class="mail"><div class="mail-h"><div><span>To</span>' + esc(SM.to) + '</div><div><span>Subject</span><b>' + esc(SM.subject) + '</b></div></div>' +
      '<div class="mail-b">' + SM.body.map(x => '<p>' + esc(x) + '</p>').join('') + '</div></div></section>';
  }

  const PR = D.proposal;
  if (PR) {
    document.getElementById('proposal').innerHTML = '<section class="prop">' +
      '<div class="prop-h"><div class="eyebrow"><span><b>Proposal</b></span><span>' + esc(PR.eyebrow || '') + '</span></div><h2>' + esc(PR.title) + '</h2>' + (PR.lead ? '<p class="sub">' + esc(PR.lead) + '</p>' : '') + '</div>' +
      '<div class="prop-cols">' + PR.blocks.map(b => '<div class="prop-b"><h3>' + esc(b.title) + '</h3><ul>' + b.items.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>').join('') + '</div>' +
      '<div class="prop-terms">' + PR.terms.map(([t, v]) => '<div class="pt"><div class="pt-k">' + esc(t) + '</div><div class="pt-v">' + esc(v) + '</div></div>').join('') + '</div>' +
      (PR.timeline ? '<div class="prop-tl">' + PR.timeline.map(([d, t]) => '<div class="tl"><div class="tl-d">' + esc(d) + '</div><div class="tl-t">' + esc(t) + '</div></div>').join('') + '</div>' : '') +
      '</section>';
  }

  document.getElementById('f-src').textContent = pick('footer', 'Sources: Google Maps business listings and public job postings, pulled ' + D.generated + '. Names of the first 100 withheld — the full list comes with the pilot.').replace('{generated}', D.generated);
})();
</script>
